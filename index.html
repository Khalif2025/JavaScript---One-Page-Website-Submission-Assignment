<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One Page Website</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Welcome to My One Page Website</h1>
    <p>Click on an image to view it in a lightbox.</p>
    <div class="gallery">
        <img src="https://source.unsplash.com/400x300/?nature" alt="Image 1" onclick="openModal(this)">
        <img src="https://source.unsplash.com/400x300/?landscape" alt="Image 2" onclick="openModal(this)">
        <img src="https://source.unsplash.com/400x300/?city" alt="Image 3" onclick="openModal(this)">
    </div>
    <div id="myModal" class="modal" onclick="closeModal()">
        <span class="close">&times;</span>
        <img class="modal-content" id="modalImg">
    </div>
    <script src="script.js"></script>
</body>
</html>
